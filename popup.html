<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Relief</title>
  <style>
    *{box-sizing:border-box}body{margin:0;width:292px;padding:18px;background:#fff;color:#222;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    header{display:flex;align-items:center;gap:13px;margin-bottom:17px}.avatar{width:56px;height:56px;border-radius:18px;background:#fff8ef;object-fit:contain;padding:3px}.title{font-size:20px;font-weight:700;letter-spacing:.1px}.sub{font-size:12px;color:#8d8983;margin-top:2px}
    button{width:100%;height:42px;margin-top:9px;border:1px solid #e7e5e2;border-radius:13px;background:white;color:#45423f;font:inherit;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}button:hover{background:#faf8f5;border-color:#ddd8d1}button:active{transform:scale(.99)}button.primary{background:#171615;border-color:#171615;color:#fff;font-weight:600}button.primary:hover{background:#302e2b}
    .scope-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 12px;border-bottom:1px solid #eee;font-size:12px;color:#65635e}.scope-switch{position:relative;width:36px;height:21px;flex:none;margin:0;padding:0;border:0;border-radius:99px;background:#ccc}.scope-switch:after{content:"";position:absolute;width:17px;height:17px;left:2px;top:2px;border-radius:50%;background:#fff;transition:transform .16s}.scope-switch[aria-checked=true]{background:#739378}.scope-switch[aria-checked=true]:after{transform:translateX(15px)}.scope-switch:disabled{opacity:.5;cursor:wait}.scope-switch:focus-visible{outline:2px solid #709277;outline-offset:3px}
    #status{min-height:18px;margin:11px 1px 0;color:#85817c;font-size:11px}
  </style>
</head>
<body>
  <header><img class="avatar" src="assets/mascot-mobile.png" alt=""><div><div class="title">Relief</div><div class="sub" id="scopeSummary">仅在 ChatGPT 显示</div></div></header>
  <div class="scope-row"><span>浏览器全页面陪伴</span><button id="scope" class="scope-switch" role="switch" aria-label="浏览器全页面陪伴" aria-checked="false" disabled></button></div>
  <button class="primary" id="toggle">显示陪伴形象</button>
  <button id="settings">提醒设置</button>
  <div id="status" role="status"></div>
  <script src="config.js"></script>
  <script src="scope.js"></script>
  <script src="popup.js"></script>
</body>
</html>
